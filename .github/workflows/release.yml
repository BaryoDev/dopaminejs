name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would publish, publish nothing'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm Trusted Publishing: lets the runner mint the OIDC
      # token npm exchanges for short-lived publish credentials. No NPM_TOKEN
      # secret exists in this repo.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No `cache: npm`: that path also writes `always-auth`, which npm 11
          # rejects as an unknown config.

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Use a Trusted-Publishing-capable npm
        run: |
          npm install -g npm@latest
          echo "node $(node --version) / npm $(npm --version)"

      - run: npm ci

      - name: Verify manifests
        run: node scripts/check-versions.js

      - name: Test
        run: npm run test:ci

      - name: Build all packages
        run: npm run build --workspaces --if-present

      # Nothing is published until every declared entry point exists on disk.
      - name: Check every entry point resolves
        run: node scripts/check-versions.js --dist

      - name: Confirm tag matches the core package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CORE=$(node -p "require('./packages/dopaminejs/package.json').version")
          if [ "$TAG" != "v$CORE" ]; then
            echo "Tag $TAG does not match dopaminejs@$CORE" >&2
            echo "Bump packages/dopaminejs/package.json or retag." >&2
            exit 1
          fi
          echo "Tag $TAG matches dopaminejs@$CORE"

      - name: Publish changed packages
        run: |
          # npm only attempts the OIDC exchange when NO credential is
          # configured for the registry. setup-node's registry-url writes an
          # npmrc containing `_authToken=${NODE_AUTH_TOKEN}`; with no NPM_TOKEN
          # secret that expanded first to a literal placeholder (E404, npm
          # published as nobody) and then, once cleared, to an empty string
          # (ENEEDAUTH). Either way the key is present and OIDC is skipped, so
          # the line has to be absent, not empty. registry.npmjs.org is the
          # default, so a bare registry line is all that is needed.
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/.npmrc"
          echo "--- npmrc npm will read ---"
          cat "$RUNNER_TEMP/.npmrc"
          echo "--- OIDC available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no} ---"
          node scripts/publish-changed.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
