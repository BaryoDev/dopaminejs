name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo. Stated so a change to the repo default
# cannot widen it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Pinned to the explicit minimum versions where require() of ES modules
        # landed (Node 20.19 and 22.12). Floating to 20/22 would silently test
        # a higher patch and never verify the floor the engines field declares.
        node: [20.19, 22.12]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step pushes, so the token is not left in .git/config
          # for npm lifecycle scripts to read.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` over `install` so a lockfile that drifts from package.json fails
      # here rather than silently resolving something different.
      - run: npm ci

      # Shipped dependencies only. Dev-tool advisories arrive as Dependabot
      # PRs and should not block an unrelated change.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck declarations
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Check manifests
        run: node scripts/check-versions.js

      - name: Check zero-dependency promise
        run: npm run check-zero-deps

      - name: Build all packages
        run: npm run build --workspaces --if-present

      # After the build, so declared entry points can be checked against what
      # the build actually emitted.
      - name: Check every entry point resolves
        run: node scripts/check-versions.js --dist

      - name: Enforce bundle size budget
        run: npm run size
