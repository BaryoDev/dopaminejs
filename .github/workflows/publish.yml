name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would publish, publish nothing'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm Trusted Publishing: lets the runner mint the OIDC
      # token npm exchanges for short-lived publish credentials. No NPM_TOKEN
      # secret exists in this repo.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # No `cache: npm`: that path also writes `always-auth`, which npm 11
          # rejects as an unknown config.

      # Trusted Publishing needs npm >= 11.5.1. Pinned to the version that
      # published v2.2.0: this job holds the OIDC publish right, so it should
      # not run whatever `latest` points at on the day. Bump it by hand.
      - name: Use a Trusted-Publishing-capable npm
        run: |
          npm install -g npm@12.0.2
          echo "node $(node --version) / npm $(npm --version)"

      - run: npm ci

      - name: Verify manifests
        run: node scripts/check-versions.js

      - name: Typecheck declarations
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build all packages
        run: npm run build --workspaces --if-present

      # Nothing is published until every declared entry point exists on disk.
      - name: Check every entry point resolves
        run: node scripts/check-versions.js --dist

      - name: Confirm tag matches the core package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CORE=$(node -p "require('./packages/dopaminejs/package.json').version")
          if [ "$TAG" != "v$CORE" ]; then
            echo "Tag $TAG does not match dopaminejs@$CORE" >&2
            echo "Bump packages/dopaminejs/package.json or retag." >&2
            exit 1
          fi
          echo "Tag $TAG matches dopaminejs@$CORE"

      # Runs only on a manual dry run, so a real publish stays quiet.
      #
      # npm's publish path collapses every trusted-publishing problem into
      # ENEEDAUTH without naming the cause, which is close to undebuggable.
      # This asks the registry directly, per package. Responses seen so far:
      #   HTTP 201  token issued, trusted publishing is configured correctly
      #   HTTP 404  "package not found" = no trusted publisher record for that
      #             package, even though the package itself exists on npm
      #
      # Every publishable package is asked, and one bad answer fails the dry
      # run. The list used to be three names, so v2.3.0 passed its dry run
      # and then failed on three plugins that had no record.
      - name: Diagnose OIDC exchange per package
        if: inputs.dry_run
        run: |
          AUD="npm:registry.npmjs.org"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')

          echo "=== OIDC claims this run presents ==="
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | node -pe 'const c=JSON.parse(require("fs").readFileSync(0,"utf8"));JSON.stringify({repository:c.repository,job_workflow_ref:c.job_workflow_ref,ref:c.ref,environment:c.environment},null,2)'

          PACKAGES=$(node -e 'const fs=require("fs");for(const d of fs.readdirSync("packages")){const f="packages/"+d+"/package.json";if(!fs.existsSync(f))continue;const p=JSON.parse(fs.readFileSync(f,"utf8"));if(!p.private)console.log(p.name)}')
          MISSING=""

          for PKG in $PACKAGES; do
            echo
            echo "=== $PKG ==="
            CODE=$(curl -sS -o /tmp/body -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$(node -pe "encodeURIComponent('$PKG')")")
            echo "HTTP $CODE"
            if [ "$CODE" = "201" ]; then
              echo "token issued"
            else
              head -c 600 /tmp/body; echo
              MISSING="$MISSING $PKG"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo
            echo "No working trusted publisher for:$MISSING" >&2
            exit 1
          fi

      - name: Publish changed packages
        run: |
          # npm only attempts the OIDC exchange when NO credential is
          # configured for the registry. setup-node's registry-url writes an
          # npmrc containing `_authToken=${NODE_AUTH_TOKEN}`; with no NPM_TOKEN
          # secret that expanded first to a literal placeholder (E404, npm
          # published as nobody) and then, once cleared, to an empty string
          # (ENEEDAUTH). Either way the key is present and OIDC is skipped, so
          # the line has to be absent, not empty. registry.npmjs.org is the
          # default, so a bare registry line is all that is needed.
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/.npmrc"
          echo "--- npmrc npm will read ---"
          cat "$RUNNER_TEMP/.npmrc"
          echo "--- OIDC available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no} ---"
          node scripts/publish-changed.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
