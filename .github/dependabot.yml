version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the build and test tools rather than one each.
      dev-tools:
        dependency-type: development

  # Workflows pin actions to a commit SHA. This keeps the pins moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
